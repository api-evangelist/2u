aid: 2u
name: 2U
description: >-
  2U, Inc. is an education technology company, founded in 2008 and headquartered
  in Lanham, Maryland, that partners with the world's top universities and
  companies to develop and deliver online education programs — from free open
  courses to bootcamps, certificates, and credit-bearing master's degrees. In
  2021 2U acquired edX, which it operates as its global online learning platform
  and primary consumer brand, offering thousands of courses across subjects such
  as artificial intelligence, data science, public health, and business. This
  profile was seeded from a Bessemer Venture Partners portfolio-linked lead and
  enriched by the API Evangelist pipeline. 2U publishes no first-party developer
  API on its corporate domain (2u.com); its programmatic and integration
  surfaces live under the edX / Open edX learning platform, and its engineering
  work is visible in the 2uinc GitHub organization.
